name: PocketStation asset bridge temp
on:
  push:
    paths:
      - .github/workflows/pocketstation-bridge-temp.yml

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Download release package
        run: |
          set -euo pipefail
          mkdir -p payload
          curl -L --fail --retry 5 --retry-delay 2 \
            "https://github.com/100121212/xcertplay/releases/download/pocketstation-assets-temp-20261006/PocketStation_Commons_Originals.zip" \
            -o package.zip
          echo "1f6521cc4c8fd1bcfffcf7a892f30856a731745460c2ec610302e714a0404240  package.zip" | sha256sum -c -
          unzip -q package.zip -d payload
          find payload -maxdepth 1 -type f -printf "%f\n" | sort
      - name: Upload originals artifact
        uses: actions/upload-artifact@v4
        with:
          name: pocketstation-commons-originals
          path: payload/
          retention-days: 1
          compression-level: 0
