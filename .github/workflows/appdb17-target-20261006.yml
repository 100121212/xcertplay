name: appdb 1.7 spec parse 20261006
on:
  push:
    paths:
      - ".github/workflows/appdb17-target-20261006.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Parse official appdb 1.7 OpenAPI
        shell: bash
        run: |
          set +e
          U='https://api.dbservices.to/v1.7/spec/openapi.yaml'
          curl -L --max-time 30 -sS "$U" -o /tmp/openapi.yaml
          echo "BYTES=$(wc -c < /tmp/openapi.yaml)"
          echo "=== ALL PATHS ==="
          grep -E '^  /[^:]+:' /tmp/openapi.yaml | head -500
          echo
          echo "=== RELEVANT CONTEXT ==="
          grep -Ein -C 8 'search|bundle.?id|track.?id|get.?links|ipa|object|appdb.?apps|link' /tmp/openapi.yaml | head -1200
