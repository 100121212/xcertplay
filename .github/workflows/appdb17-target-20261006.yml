name: appdb 1.7 target probe 20261006
on:
  push:
    paths:
      - ".github/workflows/appdb17-target-20261006.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Query appdb 1.7 for target
        shell: bash
        run: |
          set +e
          BASE='https://api.dbservices.to/v1.7'

          echo "=== SPEC DISCOVERY ==="
          curl -L --max-time 20 -sS "$BASE/spec/" -o /tmp/spec
          echo "SPEC_BYTES=$(wc -c < /tmp/spec)"
          grep -Eo 'https?://[^"[:space:]<>]+|[A-Za-z0-9_./-]+\.(json|yaml|yml)' /tmp/spec |             grep -Ei 'openapi|swagger|spec|json|yaml' | sort -u | head -100 || true
          echo

          for endpoint in search search/
          do
            for kv in               'bundle_ids=tw.app.idol'               'bundle_ids=com.app.idol'               'trackids=851443895'               'query=培養偶像之蛋'               'query=育ててアイドルの卵'
            do
              key="${kv%%=*}"
              val="${kv#*=}"
              echo "=== POST /$endpoint type=ios $key=$val ==="
              curl -L --max-time 30 -sS -X POST                 -F 'type=ios' -F "$key=$val"                 "$BASE/$endpoint" | head -c 100000
              echo
              echo "=== GET /$endpoint type=ios $key=$val ==="
              curl -L --max-time 30 -sS -G                 --data-urlencode 'type=ios'                 --data-urlencode "$key=$val"                 "$BASE/$endpoint" | head -c 100000
              echo
            done
          done

          echo "=== GET_LINKS CANDIDATES ==="
          for path in get_links get_links/
          do
            for value in '851443895' 'tw.app.idol'
            do
              echo "--- $path $value"
              curl -L --max-time 30 -sS -G                 --data-urlencode 'type=ios'                 --data-urlencode "trackids=$value"                 "$BASE/$path" | head -c 100000
              echo
            done
          done
