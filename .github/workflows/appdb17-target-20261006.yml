name: appdb 1.7 spec parse 20261006
on:
  push:
    paths:
      - ".github/workflows/appdb17-target-20261006.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Parse official appdb 1.7 OpenAPI
        shell: bash
        run: |
          set +e
          U='https://api.dbservices.to/v1.7/spec/openapi.yaml'
          curl -L --max-time 30 -sS "$U" -o /tmp/openapi.yaml
          echo "BYTES=$(wc -c < /tmp/openapi.yaml)"
          echo "=== HEAD ==="
          sed -n '1,220p' /tmp/openapi.yaml
          echo
          echo "=== PATH KEYS ==="
          grep -En '^[[:space:]]*/[^:]+:' /tmp/openapi.yaml | head -600
          echo
          echo "=== INDEX/DOWNLOAD/APP CONTEXT ==="
          grep -Ein -C 12 'index|download|bundle.?id|track.?id|application identifier|universal|links|official app|app list|list apps|search' /tmp/openapi.yaml | head -1600 || true
          exit 0
