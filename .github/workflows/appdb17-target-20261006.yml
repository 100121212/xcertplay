name: appdb 1.7 search_index probe 20261006
on:
  push:
    paths:
      - ".github/workflows/appdb17-target-20261006.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Read search_index schema and query target
        shell: bash
        run: |
          set +e
          BASE='https://api.dbservices.to/v1.7'
          curl -L --max-time 30 -sS "$BASE/spec/openapi.yaml" -o /tmp/openapi.yaml

          echo "=== SEARCH_INDEX SCHEMA ==="
          sed -n '2984,3141p' /tmp/openapi.yaml

          echo
          echo "=== TRY COMMON QUERY FORMS ==="
          for q in             '育ててアイドルの卵'             '851443895'             'tw.app.idol'             'com.app.idol'
          do
            echo "--- q=$q"
            curl -L --max-time 30 -sS -X POST               --data-urlencode "query=$q"               --data-urlencode 'type=ios'               "$BASE/search_index/" | head -c 120000
            echo
          done
          exit 0
