name: appdb 1.7 content type probe 20261006
on:
  push:
    paths:
      - ".github/workflows/appdb17-target-20261006.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Read content type enum and query target
        shell: bash
        run: |
          set +e
          BASE='https://api.dbservices.to/v1.7'
          curl -L --max-time 30 -sS "$BASE/spec/openapi.yaml" -o /tmp/openapi.yaml

          echo "=== newContentType ==="
          grep -n -A30 -B3 'newContentType:' /tmp/openapi.yaml | head -80

          echo "=== search_index no type ==="
          for name in             '育ててアイドルの卵'             '851443895'             'tw.app.idol'             'com.app.idol'
          do
            echo "--- name=$name"
            curl -L --max-time 30 -sS -X POST               --data-urlencode "name=$name"               --data-urlencode 'compatibility=ios'               --data-urlencode 'length=100'               "$BASE/search_index/" | head -c 160000
            echo
          done
          exit 0
