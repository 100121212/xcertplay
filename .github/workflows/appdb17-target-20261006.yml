name: iTunes historical metadata probe 20261006
on:
  push:
    paths:
      - ".github/workflows/appdb17-target-20261006.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Recover historical iTunes metadata for 851443895
        shell: bash
        run: |
          set +e
          echo "=== CURRENT LOOKUP ==="
          for u in             'https://itunes.apple.com/lookup?id=851443895&country=jp'             'https://itunes.apple.com/jp/lookup?id=851443895'             'https://itunes.apple.com/lookup?id=851443895'
          do
            echo "--- $u"
            curl -L --max-time 30 -sS "$u" | head -c 50000
            echo
          done

          echo "=== WAYBACK CDX LOOKUP URLS ==="
          urls=(
            'itunes.apple.com/lookup?id=851443895*'
            'itunes.apple.com/jp/lookup?id=851443895*'
            'itunes.apple.com/*/lookup?id=851443895*'
            'itunes.apple.com/*/app/*/id851443895*'
            'apps.apple.com/*/app/*/id851443895*'
            'itunes.apple.com/WebObjects/MZStore.woa/wa/viewSoftware?id=851443895*'
          )
          for u in "${urls[@]}"
          do
            echo "--- $u"
            curl -L --max-time 60 -sS -G 'https://web.archive.org/cdx/search/cdx'               --data-urlencode "url=$u"               --data-urlencode 'output=json'               --data-urlencode 'fl=timestamp,original,statuscode,mimetype,digest,length'               --data-urlencode 'filter=statuscode:200'               --data-urlencode 'collapse=digest'               --data-urlencode 'limit=100' | head -c 150000
            echo
          done
          exit 0
