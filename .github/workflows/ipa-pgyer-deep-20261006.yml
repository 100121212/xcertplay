name: IPA PGYER deep probe 20261006
on:
  push:
    paths:
      - ".github/workflows/ipa-pgyer-deep-20261006.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Extract real PGYER download logic
        shell: bash
        run: |
          set +e
          PAGE='https://www.pgyer.com/ipa/ipa/tw.app.idol'
          curl -L --max-time 45 -sS "$PAGE" -o /tmp/page

          echo "=== SCRIPT URLS ==="
          python3 -c "import pathlib,re,urllib.parse; s=pathlib.Path('/tmp/page').read_text(errors='replace'); u=sorted(set(re.findall(r'<script[^>]+src=\"([^\"]+\.js)\"',s,re.I))); u=[urllib.parse.urljoin('https://www.pgyer.com',x) for x in u]; pathlib.Path('/tmp/jsurls').write_text('\n'.join(u)); print('\n'.join(u))"
          echo

          : > /tmp/alljs
          while IFS= read -r u; do
            [ -z "$u" ] && continue
            echo "FETCH $u"
            curl -L --max-time 30 -sS "$u" >> /tmp/alljs
            printf '\n' >> /tmp/alljs
          done < /tmp/jsurls

          echo "ALLJS_BYTES $(wc -c < /tmp/alljs)"
          echo

          cat > /tmp/analyze.py <<'PY'
          from pathlib import Path
          import re
          s = Path('/tmp/alljs').read_text(errors='replace')
          patterns = [
              'download', 'title_download', 'window.open', 'location.href',
              'fetch(', 'axios', 'XMLHttpRequest', 'oss_object',
              'object_name', 'apk.live', 'appmeme.com', '.ipa',
              '/api/', 'api.', 'href:', 'href='
          ]
          for p in patterns:
              ms = list(re.finditer(re.escape(p), s, re.I))
              print(f"\n### {p} COUNT={len(ms)}")
              for m in ms[:200]:
                  a=max(0,m.start()-500); b=min(len(s),m.end()+1200)
                  print(s[a:b])
                  print('---')

          print("\n### STRING LITERALS")
          seen=set()
          for m in re.finditer(r'["\x27]([^"\x27]{1,900})["\x27]', s):
              v=m.group(1)
              if re.search(r'download|\.ipa|apk\.live|appmeme|oss|object|api|file',v,re.I):
                  if v not in seen:
                      seen.add(v)
                      print(v)
          PY
          python3 /tmp/analyze.py
