name: IPA PGYER deep probe 20261006
on:
  push:
    paths:
      - ".github/workflows/ipa-pgyer-deep-20261006.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Trace PGYER IPA download implementation
        shell: bash
        run: |
          set +e
          PAGE='https://www.pgyer.com/ipa/ipa/tw.app.idol'
          curl -L --max-time 45 -sS "$PAGE" -o /tmp/page

          echo "=== PAGE DOWNLOAD CONTEXT ==="
          python3 -c "import pathlib,re; s=pathlib.Path('/tmp/page').read_text(errors='replace'); [(print(s[max(0,m.start()-800):min(len(s),m.end()+1600)]+'\n---')) for m in list(re.finditer('download',s,re.I))[:40]]"
          echo

          echo "=== FETCH ALL JS CHUNKS ==="
          python3 -c "import pathlib,re; s=pathlib.Path('/tmp/page').read_text(errors='replace'); u=sorted(set(re.findall(r'https://apkhub-static\.appmeme\.com/[^\"[:space:]<>]+\.js',s))); pathlib.Path('/tmp/jsurls').write_text('\n'.join(u)); print('\n'.join(u))"
          : > /tmp/alljs
          while IFS= read -r u; do
            [ -z "$u" ] && continue
            echo "FETCH $u"
            curl -L --max-time 30 -sS "$u" >> /tmp/alljs
            printf '\n' >> /tmp/alljs
          done < /tmp/jsurls
          echo "ALLJS_BYTES $(wc -c < /tmp/alljs)"
          echo

          cat > /tmp/analyze.py <<'PY'
          from pathlib import Path
          import re
          s = Path('/tmp/alljs').read_text(errors='replace')
          pats = [
              'download', 'assets.apk.live', 'assets.appmeme.com',
              '.ipa', 'oss_object', 'object_name', 'fetch(',
              'axios', '/api/', 'api.', 'location.href', 'window.open'
          ]
          for p in pats:
              print('\n### CONTEXT', p)
              ms = list(re.finditer(re.escape(p), s, re.I))
              print('COUNT', len(ms))
              for m in ms[:120]:
                  print(s[max(0, m.start()-350):min(len(s), m.end()+900)])
                  print('---')

          print('\n### QUOTED LITERALS WITH DOWNLOAD/API/IPA')
          vals = set()
          for m in re.finditer(r'["\x27]([^"\x27]{1,600})["\x27]', s):
              v = m.group(1)
              if re.search(r'download|\.ipa|apk\.live|appmeme|oss|object|api', v, re.I):
                  vals.add(v)
          for v in sorted(vals):
              print(v)
          PY
          python3 /tmp/analyze.py
          echo

          echo "=== DIRECT OBJECT CANDIDATES ==="
          for u in             'https://assets.apk.live/tw.app.idol--ipa-1_0_1.ipa'             'https://assets.appmeme.com/tw.app.idol--ipa-1_0_1.ipa'             'https://assets.apk.live/tw.app.idol--ipa-1_0_1'             'https://assets.appmeme.com/tw.app.idol--ipa-1_0_1'             'https://download.apk.live/tw.app.idol--ipa-1_0_1.ipa'             'https://download.appmeme.com/tw.app.idol--ipa-1_0_1.ipa'             'https://assets.apk.live/tw.app.idol--ipa-1.0.1.ipa'             'https://assets.appmeme.com/tw.app.idol--ipa-1.0.1.ipa'
          do
            echo "--- $u"
            rm -f /tmp/h /tmp/b
            curl -L --max-time 25 -sS -D /tmp/h -r 0-63 "$u" -o /tmp/b
            sed -n '1,35p' /tmp/h
            printf 'BODY_HEX '
            od -An -tx1 -N64 /tmp/b | tr -d '\n'
            echo
            printf 'BODY_STRINGS '
            strings -n 2 /tmp/b | head -8
            echo
          done
