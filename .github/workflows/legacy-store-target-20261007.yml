name: Legacy Store target lookup 20261007
on:
  push:
    paths:
      - ".github/workflows/legacy-store-target-20261007.yml"

jobs:
  lookup:
    runs-on: ubuntu-latest
    steps:
      - name: Query Legacy Store public API
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          import urllib.request, urllib.parse, json

          base="https://legacystore.app"
          urls=[
              "/api/v1/apps/851443895",
              "/api/v1/apps/tw.app.idol",
          ]
          qs=[
              "851443895",
              "tw.app.idol",
              "育ててアイドルの卵",
              "培養偶像之蛋",
              "Chronus",
              "Chronus Inc.",
              "Chronus App Inc.",
              "idol",
          ]
          for q in qs:
              urls.append("/api/v1/apps?"+urllib.parse.urlencode({"q":q,"sort":"relevance","limit":"200"}))

          for path in urls:
              url=base+path
              print("\n===== ",url," =====")
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0","Accept":"application/json"})
              try:
                  with urllib.request.urlopen(req,timeout=60) as r:
                      raw=r.read().decode("utf-8","replace")
                      print("HTTP",r.status,"BYTES",len(raw),"TYPE",r.headers.get("Content-Type"))
                      try:
                          obj=json.loads(raw)
                          print(json.dumps(obj,ensure_ascii=False,indent=2)[:300000])
                      except Exception:
                          print(raw[:300000])
              except Exception as e:
                  print("ERR",repr(e))
                  if hasattr(e,"read"):
                      try: print(e.read().decode("utf-8","replace")[:50000])
                      except: pass
          PY
