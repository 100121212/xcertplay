name: appdb 1.7 API probe 20261007
on:
  push:
    paths:
      - ".github/workflows/appdb17-probe-20261007.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Read appdb 1.7 OpenAPI and query target
        shell: bash
        run: |
          set +e
          UA='Mozilla/5.0'
          curl -L --connect-timeout 5 --max-time 20 -sS -A "$UA"             'https://api.dbservices.to/v1.7/spec/openapi.yaml' -o /tmp/openapi.yaml

          echo '===== OPENAPI SIZE ====='
          wc -c /tmp/openapi.yaml
          echo '===== SEARCH ENDPOINT CONTEXT ====='
          grep -n -E '^  /search/?|bundle_ids|trackids|query:|search:|type:' /tmp/openapi.yaml | head -300
          echo '===== SEARCH BLOCK ====='
          awk '
            /^  \/search\/?/ {p=1}
            p {print}
            p && /^  \/[^s]/ {exit}
          ' /tmp/openapi.yaml | head -1200

          echo '===== DIRECT TESTS ====='
          for spec in             'bundle_ids|com.app.idol'             'trackids|851443895'             'query|育ててアイドルの卵'
          do
            key="${spec%%|*}"
            val="${spec#*|}"
            echo "--- $key=$val"
            curl -L --connect-timeout 5 --max-time 20 -sS -A "$UA"               -X POST -F 'type=ios' -F "$key=$val"               'https://api.dbservices.to/v1.7/search/'
            echo
          done
