name: appdb 1.7 target search 20261007
on:
  push:
    paths:
      - ".github/workflows/appdb17-probe-20261007.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Search appdb 1.7 index for target
        shell: bash
        run: |
          set +e
          BASE='https://api.dbservices.to/v1.7/search_index/'
          UA='Mozilla/5.0'

          for name in             '育ててアイドルの卵'             '育ててアイドル'             'アイドルの卵'             'com.app.idol'             'idol'             'Chronus'
          do
            echo "===== NAME=$name ====="
            curl -L --connect-timeout 5 --max-time 20 -sS -A "$UA"               -X POST               -H 'Content-Type: application/x-www-form-urlencoded'               --data-urlencode 'type=ios'               --data-urlencode "name=$name"               --data-urlencode 'brand=appdb'               --data-urlencode 'lang=en'               --data-urlencode 'start=0'               --data-urlencode 'length=100'               "$BASE"
            echo
          done
