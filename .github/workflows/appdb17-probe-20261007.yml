name: appdb 1.7 content type probe 20261007
on:
  push:
    paths:
      - ".github/workflows/appdb17-probe-20261007.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Read newContentType enum
        shell: bash
        run: |
          set -e
          curl -L --connect-timeout 5 --max-time 20 -sS             'https://api.dbservices.to/v1.7/spec/openapi.yaml' -o /tmp/openapi.yaml
          echo '===== newContentType ====='
          line=$(grep -n '^    newContentType:' /tmp/openapi.yaml | head -1 | cut -d: -f1)
          echo "LINE=$line"
          if [ -n "$line" ]; then
            start=$line
            end=$((line+80))
            sed -n "${start},${end}p" /tmp/openapi.yaml
          fi
