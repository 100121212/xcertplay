name: Wayback raw record probe 20261007
on:
  push:
    paths:
      - ".github/workflows/appdb17-probe-20261007.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Query CDX raw record coordinates
        shell: bash
        run: |
          set +e
          TARGET='https://itunes.apple.com/jp/app/yuteteaidoruno-luan/id851443895?mt=8'
          echo '===== CDX EXTENDED ====='
          curl -G -L --connect-timeout 5 --max-time 20 -sS             'https://web.archive.org/cdx/search/cdx'             --data-urlencode "url=$TARGET"             --data-urlencode 'output=json'             --data-urlencode 'filter=statuscode:200'             --data-urlencode 'fl=urlkey,timestamp,original,mimetype,statuscode,digest,length,offset,filename'             --data-urlencode 'collapse=digest'             --data-urlencode 'limit=50'
          echo

          echo '===== CDX TXT ====='
          curl -G -L --connect-timeout 5 --max-time 20 -sS             'https://web.archive.org/cdx/search/cdx'             --data-urlencode "url=$TARGET"             --data-urlencode 'output=txt'             --data-urlencode 'filter=statuscode:200'             --data-urlencode 'fl=urlkey,timestamp,original,mimetype,statuscode,digest,length,offset,filename'             --data-urlencode 'collapse=digest'             --data-urlencode 'limit=50'
          echo

          echo '===== AVAILABILITY API ====='
          curl -L --connect-timeout 5 --max-time 20 -sS             "https://archive.org/wayback/available?url=$(python3 -c 'import urllib.parse; print(urllib.parse.quote("'"$TARGET"'",safe=""))')&timestamp=20150913014401"
          echo
