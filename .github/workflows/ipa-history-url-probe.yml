name: IPA historical URL probe
on:
  push:
    paths:
      - ".github/workflows/ipa-history-url-probe.yml"
      - "tools/ipa_history_url_probe.py"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe historical URLs and mirrors
        run: python3 tools/ipa_history_url_probe.py
