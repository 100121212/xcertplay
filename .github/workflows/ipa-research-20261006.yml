name: IPA research probe 20261006
on:
  push:
    paths:
      - ".github/workflows/ipa-research-20261006.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect appdb 1.7 swagger
        shell: bash
        run: |
          set +e
          curl -L --max-time 30 -sS 'https://api.dbservices.to/v1.7/spec/' -o /tmp/spec
          echo "=== SPEC HTML ==="
          cat /tmp/spec
          echo
          echo "=== HREF SRC URL TOKENS ==="
          grep -Eo '(https?://[^"[:space:]]+|[A-Za-z0-9_./-]+\.(json|yaml|yml|js))' /tmp/spec | sort -u
