name: IPA research probe 20261006
on:
  push:
    paths:
      - ".github/workflows/ipa-research-20261006.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Parse appdb API 1.7 OpenAPI
        shell: bash
        run: |
          set +e
          curl -L --max-time 30 -sS 'https://api.dbservices.to/v1.7/spec/openapi.yaml' -o /tmp/openapi.yaml
          echo "=== OPENAPI META ==="
          wc -c /tmp/openapi.yaml
          head -n 30 /tmp/openapi.yaml
          echo
          echo "=== PATHS ==="
          grep -E '^  /[^:]+:' /tmp/openapi.yaml | sed 's/^  //'
          echo
          echo "=== SEARCH/BUNDLE/TRACK/LINK MATCHES ==="
          grep -nEi 'search|bundle|trackid|track_id|bundle_id|bundle_ids|get_links|links|ios' /tmp/openapi.yaml | head -n 500
