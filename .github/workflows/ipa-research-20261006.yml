name: IPA research probe 20261006
on:
  push:
    paths:
      - ".github/workflows/ipa-research-20261006.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe PGYER IPAHUB target
        shell: bash
        run: |
          set +e
          URL='https://www.pgyer.com/ipa/ipa/tw.app.idol'
          echo "=== HEADERS ==="
          curl -L --max-time 45 -sS -D /tmp/h "$URL" -o /tmp/page
          cat /tmp/h
          echo
          echo "=== SIZE ==="
          wc -c /tmp/page
          echo
          echo "=== DOWNLOAD/HREF/SCRIPT MATCHES ==="
          grep -Eo 'https?://[^"[:space:]<>]+' /tmp/page | sed 's/&amp;/\&/g' | sort -u | head -n 300
          echo
          grep -nEi 'download|ipa|tw\.app\.idol|href=|data-url|file|pgyer' /tmp/page | head -n 600
