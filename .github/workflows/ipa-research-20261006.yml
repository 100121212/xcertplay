name: IPA research probe 20261006
on:
  push:
    paths:
      - ".github/workflows/ipa-research-20261006.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect search_index schema
        shell: bash
        run: |
          set +e
          curl -L --max-time 30 -sS 'https://api.dbservices.to/v1.7/spec/openapi.yaml' -o /tmp/openapi.yaml
          echo "=== SEARCH_INDEX BLOCK ==="
          sed -n '2980,3160p' /tmp/openapi.yaml
