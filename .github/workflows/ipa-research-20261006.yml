name: IPA research probe 20261006
on:
  push:
    paths:
      - ".github/workflows/ipa-research-20261006.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Broaden appdb index search
        shell: bash
        run: |
          set +e
          BASE='https://api.dbservices.to/v1.7'
          curl -L --max-time 30 -sS "$BASE/spec/openapi.yaml" -o /tmp/openapi.yaml
          echo "=== TYPE SCHEMA ==="
          sed -n '7995,8030p' /tmp/openapi.yaml
          echo
          for name in 'アイドル' 'idol' '卵' '育てて' 'GMO' 'PLAY MUSIC' 'Chronus App' 'クロノス'
          do
            echo "=== SEARCH broad name=$name ==="
            curl -L --max-time 30 -sS -X POST "$BASE/search_index/"               -H 'Content-Type: application/x-www-form-urlencoded'               --data-urlencode 'brand=appdb'               --data-urlencode 'lang=en'               --data-urlencode "name=$name"               --data-urlencode 'start=0'               --data-urlencode 'length=100'
            echo
          done
          for dev in 'Chronus App Inc.' 'Chronus Inc.' 'GMO PLAY MUSIC Inc.' 'GMO PLAY MUSIC'
          do
            echo "=== SEARCH developer_name=$dev ==="
            curl -L --max-time 30 -sS -X POST "$BASE/search_index/"               -H 'Content-Type: application/x-www-form-urlencoded'               --data-urlencode 'brand=appdb'               --data-urlencode 'lang=en'               --data-urlencode "developer_name=$dev"               --data-urlencode 'start=0'               --data-urlencode 'length=100'
            echo
          done
