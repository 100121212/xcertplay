name: IPA PGYER direct download 20261007
on:
  push:
    paths:
      - ".github/workflows/ipa-pgyer-direct-20261007.yml"

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Probe direct API
        shell: bash
        run: |
          set -e
          URL='https://www.pgyer.com/ipa/api/download?id=tw.app.idol'
          curl -L --max-time 90 -sS             -A 'Mozilla/5.0'             -D /tmp/headers             -w '\nFINAL_URL=%{url_effective}\nHTTP_CODE=%{http_code}\nCONTENT_TYPE=%{content_type}\nSIZE_DOWNLOAD=%{size_download}\n'             "$URL" -o /tmp/body | tee /tmp/meta

          echo '=== HEADERS ==='
          cat /tmp/headers
          echo '=== META ==='
          cat /tmp/meta
          echo '=== FILE ==='
          file /tmp/body || true
          echo '=== SHA256 ==='
          sha256sum /tmp/body || true
          echo '=== FIRST64 ==='
          od -An -tx1 -N64 /tmp/body | tr -d '\n'; echo
          echo '=== SIZE ==='
          wc -c /tmp/body

          if file /tmp/body | grep -Eqi 'Zip archive|iOS application archive'; then
            cp /tmp/body target.ipa
            echo '=== ZIP LIST HEAD ==='
            unzip -l target.ipa | head -80
          else
            echo '=== BODY TEXT HEAD ==='
            head -c 12000 /tmp/body || true
            echo
          fi

      - name: Upload IPA if present
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: idol-egg-pgyer-probe
          path: target.ipa
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 1
